  <body>
    <!-- PWA Install Button -->
    <div id="pwa-install-button" style="display: none;" class="fixed top-4 right-4 z-50">
      <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow-lg flex items-center space-x-2 text-sm font-medium transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3M3 17V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v10a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path>
        </svg>
        <span>Install App</span>
      </button>
    </div>

    <div id="root"></div>
    
    <!-- PWA Scripts -->
    <script>
      // Register service worker and setup PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }

      // Install PWA functionality
      let deferredPrompt;
      
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const installButton = document.getElementById('pwa-install-button');
        if (installButton) {
          installButton.style.display = 'block';
          installButton.addEventListener('click', async () => {
            if (deferredPrompt) {
              deferredPrompt.prompt();
              const { outcome } = await deferredPrompt.userChoice;
              if (outcome === 'accepted') {
                installButton.style.display = 'none';
              }
              deferredPrompt = null;
            }
          });
        }
      });

      window.addEventListener('appinstalled', () => {
        const installButton = document.getElementById('pwa-install-button');
        if (installButton) {
          installButton.style.display = 'none';
        }
        console.log('PWA was installed');
      });

      // Add iOS installation prompt
      function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      }

      function isInStandaloneMode() {
        return ('standalone' in window.navigator) && window.navigator.standalone;
      }

      if (isIOS() && !isInStandaloneMode()) {
        setTimeout(() => {
          const iosPrompt = document.createElement('div');
          iosPrompt.className = 'fixed bottom-4 left-4 right-4 bg-gray-900 text-white p-4 rounded-lg shadow-lg z-50';
          iosPrompt.innerHTML = `
            <div class="flex items-start space-x-3">
              <div class="flex-1">
                <p class="text-sm font-medium mb-1">Install Flight Game</p>
                <p class="text-xs opacity-90">
                  Tap <svg class="inline w-4 h-4 mx-1" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"/></svg> then "Add to Home Screen"
                </p>
              </div>
              <button class="text-gray-400 hover:text-white" onclick="this.parentElement.parentElement.remove()">
                ×
              </button>
            </div>
          `;
          document.body.appendChild(iosPrompt);
          
          setTimeout(() => {
            if (iosPrompt.parentNode) {
              iosPrompt.remove();
            }
          }, 15000);
        }, 3000);
      }
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
